<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-форма</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e9eef2;
            margin: 0;
            padding: 40px 20px;
        }

        form {
            width: 320px;
            margin: 20px auto;
            padding: 25px;
            background: #f5f5f5;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, textarea, select {
            box-sizing: border-box;
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #004999;
        }
    </style>
</head>
<body>

<form action="/submit" method="post">
    <h2>Регистрация</h2>

    <label for="name">Имя</label>
    <input id="name" type="text" placeholder="Введите имя"
           required minlength="2">

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Введите email" required>

    <label for="password">Пароль</label>
    <input id="password" type="password" placeholder="Минимум 6 символов"
           required minlength="6">

    <label for="city">Город</label>
    <select id="city" required>
        <option value="">Выберите город</option>
        <option>Павлодар</option>
        <option>Астана</option>
        <option>Алматы</option>
        <option>Караганда</option>
    </select>

    <label for="comment">Комментарий</label>
    <textarea id="comment" placeholder="Ваш комментарий"
              maxlength="300"></textarea>

    <button type="submit">Отправить</button>
</form>

</body>
</html>
